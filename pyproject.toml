[project]
name = "mandarin-tone-recorder"
version = "0.1.0"
description = "A Django platform for Mandarin recording experiments and practice."
readme = "README.md"
authors = [
    { name = "abecode", email = "abe.kazemzadeh@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "django>=6.0,<6.1",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "soundfile>=0.13.1",
]

[project.scripts]
mandarin-tone-recorder = "mandarin_tone_recorder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
