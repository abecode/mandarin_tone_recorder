{% extends "base.html" %}

{% block title %}Sign up | Mandarin Tone Recorder{% endblock %}

{% block content %}
  <section class="auth-panel">
    <h1>Sign up</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="primary-action" type="submit">Sign up</button>
    </form>
    <p>
      Already have an account?
      <a href="{% url 'accounts:login' %}">Log in</a>
    </p>
  </section>
{% endblock %}
