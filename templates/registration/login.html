{% extends "base.html" %}

{% block title %}Log in | Mandarin Tone Recorder{% endblock %}

{% block content %}
  <section class="auth-panel">
    <h1>Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
      <button class="primary-action" type="submit">Log in</button>
    </form>
    <p>
      Need an account?
      <a href="{% url 'accounts:signup' %}">Sign up</a>
    </p>
  </section>
{% endblock %}
