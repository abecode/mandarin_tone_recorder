# Install only after Certbot has issued a certificate for both names.
server {
    listen 80;
    server_name mantonesarehard.com www.mantonesarehard.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://mantonesarehard.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.mantonesarehard.com;

    ssl_certificate /etc/letsencrypt/live/mantonesarehard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mantonesarehard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mantonesarehard.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mantonesarehard.com;

    ssl_certificate /etc/letsencrypt/live/mantonesarehard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mantonesarehard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /static/ {
        alias /srv/mandarin-tone-recorder/app/staticfiles/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8001;
    }
}
