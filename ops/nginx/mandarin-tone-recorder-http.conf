# Temporary HTTP-only site for Let's Encrypt webroot validation.
# Replace this file with the HTTPS site after both names resolve here.
server {
    listen 80;
    server_name mantonesarehard.com www.mantonesarehard.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
