[project]
name = "mandarin-tone-recorder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abecode", email = "abe.kazemzadeh@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "gradio>=6.14.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "soundfile>=0.13.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.0",
    "sqlmodel>=0.0.38",
]

[project.scripts]
mandarin-tone-recorder = "mandarin_tone_recorder.web:main"
mandarin-tone-recorder-gradio = "gradio_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
