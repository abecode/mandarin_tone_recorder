<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mandarin Tone Recorder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', path='/recorder.css') }}?v={{ static_version }}">
</head>

<body>
  <main id="app">
    <section id="setup-screen" class="screen">
      <div class="screen-inner">
        <h1>Mandarin Tone Recorder</h1>

        <div class="metadata-grid">
          <label>
            Participant ID
            <input id="participant-id" value="p001">
          </label>

          <label>
            Speaker type
            <select id="speaker-type">
              <option value="native">native</option>
              <option value="heritage">heritage</option>
              <option value="learner" selected>learner</option>
              <option value="other">other</option>
            </select>
          </label>

          <label>
            Mandarin background
            <input
              id="mandarin-background"
              placeholder="e.g., L2 learner, 2 years study"
            >
          </label>

          <label>
            Experiment condition
            <select id="experiment-condition">
              <option value="tone_bearing" selected>tone-bearing: tones 1-4</option>
              <option value="tone_unspecified">tone-unspecified: unaccented prompt</option>
            </select>
          </label>

          <label>
            Target duration
            <select id="target-duration-sec">
              <option value="300">5 minutes</option>
              <option value="600" selected>10 minutes</option>
              <option value="900">15 minutes</option>
              <option value="1200">20 minutes</option>
            </select>
          </label>
        </div>

        <div class="setup-actions">
          <button id="start-btn" class="big-btn primary-btn">Start</button>
        </div>

        <div id="setup-status" class="status-text"></div>
      </div>
    </section>

    <section id="recording-screen" class="screen hidden">
      <div class="recording-inner">
        <div id="stimulus">Ready</div>
        <div id="stimulus-details"></div>

        <div id="recording-controls" class="controls">
          <button id="redo-btn" class="secondary-btn">Redo</button>
          <button id="next-btn" class="big-btn accept-btn">Next</button>
          <button id="stop-btn" class="danger-btn">Stop Session</button>
        </div>

        <div id="progress" class="progress-text">Press Start to begin.</div>
        <div id="status" class="status-text"></div>
      </div>
    </section>

    <section id="ready-to-retry-screen" class="screen hidden">
      <div class="recording-inner">
        <div id="retry-stimulus" class="state-stimulus"></div>
        <div id="retry-details" class="state-details"></div>
        <div id="retry-message" class="state-message"></div>

        <div class="controls">
          <button id="retry-btn" class="big-btn primary-btn">Try Again</button>
          <button id="retry-stop-btn" class="danger-btn">Stop Session</button>
        </div>
      </div>
    </section>

    <section id="target-reached-screen" class="screen hidden">
      <div class="recording-inner">
        <div id="target-stimulus" class="state-stimulus"></div>
        <div id="target-details" class="state-details"></div>
        <div id="target-message" class="state-message">
          Target time reached.
        </div>

        <div class="controls">
          <button id="continue-btn" class="big-btn accept-btn">Continue</button>
          <button id="finish-btn" class="secondary-btn">Finish Session</button>
        </div>
      </div>
    </section>

    <section id="finished-screen" class="screen hidden">
      <div class="screen-inner centered">
        <h1>Done</h1>
        <div id="finished-message" class="state-message"></div>
        <button id="finished-start-again-btn" class="big-btn primary-btn">Start Again</button>
      </div>
    </section>

    <section id="aborted-screen" class="screen hidden">
      <div class="screen-inner centered">
        <h1>Stopped</h1>
        <div id="aborted-message" class="state-message"></div>
        <button id="aborted-start-again-btn" class="big-btn primary-btn">Start Again</button>
      </div>
    </section>
  </main>

  <script>
    window.MTR_MAX_DURATION_SEC = {{ max_duration_sec }};
    window.MTR_DEFAULT_SESSION_TARGET_DURATION_SEC = {{ default_session_target_duration_sec }};
  </script>
  <script src="{{ url_for('static', path='/recorder.js') }}?v={{ static_version }}"></script>
</body>
</html>
